<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">A panorama inspired by the personal library</title><desc id="desc">An original literary landscape of a watchful tower, a swirling cosmos, a mountain castle, a loyal dog, and a glowing futuristic city at twilight.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#091b1c"/><stop offset=".5" stop-color="#244647"/><stop offset=".78" stop-color="#d28e55"/><stop offset="1" stop-color="#f0c77c"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#f8dca0" stop-opacity=".95"/><stop offset=".35" stop-color="#b7b8a0" stop-opacity=".4"/><stop offset="1" stop-color="#557a7c" stop-opacity="0"/></radialGradient>
 <radialGradient id="planet"><stop stop-color="#dbe7cb"/><stop offset=".68" stop-color="#779c9b"/><stop offset="1" stop-color="#35565b"/></radialGradient>
 <linearGradient id="rock" x2="0" y2="1"><stop stop-color="#334d42"/><stop offset="1" stop-color="#101f1b"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff1bd"/><stop offset="1" stop-color="#ba7942"/></linearGradient>
 <linearGradient id="city" x2="0" y2="1"><stop stop-color="#233d48"/><stop offset="1" stop-color="#0a1b22"/></linearGradient>
 <linearGradient id="book" x2="1" y2="1"><stop stop-color="#9ab58c"/><stop offset="1" stop-color="#456c62"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
 <pattern id="windows" width="28" height="32" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="8" height="13" rx="1" fill="#86c5ba" opacity=".7"/><rect x="17" y="5" width="6" height="13" rx="1" fill="#edc888" opacity=".56"/></pattern>
 <pattern id="stars" width="127" height="91" patternUnits="userSpaceOnUse"><circle cx="8" cy="19" r="1.4" fill="#fff5d6"/><circle cx="67" cy="41" r="1" fill="#fff5d6"/><circle cx="101" cy="14" r="1.6" fill="#fff5d6"/><circle cx="38" cy="75" r="1" fill="#fff5d6"/><path d="M87 63v5m-2.5-2.5h5" stroke="#fff5d6" stroke-width=".8"/></pattern>
</defs>
